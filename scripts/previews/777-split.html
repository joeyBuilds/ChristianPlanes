<!DOCTYPE html><html><head><style>
body{background:#0a1929;color:#e2e8f0;font-family:system-ui;padding:2rem}
h1{color:#60a5fa;margin-bottom:1.5rem}
.card{background:#0d1f35;border:1px solid #1e3a5f;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem}
.card h3{font-size:.8rem;color:#94a3b8;margin-bottom:1rem}
.box{background:#060f1d;border-radius:8px;padding:1rem;text-align:center}
.box img{max-width:100%;max-height:400px;filter:brightness(0) invert(1)}
</style></head><body>
<h1>777-300ER — Final</h1>
<div class="card"><h3>SIDE</h3><div class="box"><img src="777-side.png"></div></div>
<div class="card"><h3>TOP (nose-left, no rotation needed)</h3><div class="box"><img src="777-top.png"></div></div>
<div class="card"><h3>FRONT</h3><div class="box"><img src="777-front.png"></div></div>
</body></html>
