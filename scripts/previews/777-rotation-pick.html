<!DOCTYPE html><html><head><style>
body{background:#0a1929;color:#e2e8f0;font-family:system-ui;padding:2rem}
h1{color:#60a5fa;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.card{background:#0d1f35;border:1px solid #1e3a5f;border-radius:12px;padding:1rem}
h3{font-size:.8rem;color:#94a3b8;margin-bottom:.5rem}
.box{background:#060f1d;border-radius:8px;padding:.5rem;text-align:center}
.box img{max-width:100%;max-height:400px;filter:brightness(0) invert(1)}
</style></head><body>
<h1>777 Top View — Pick the right rotation</h1>
<div class="grid">
<div class="card"><h3>RAW (no rotation)</h3><div class="box"><img src="777-top-raw.png"></div></div>
<div class="card"><h3>90° CCW (ROTATE_90)</h3><div class="box"><img src="777-top-ccw.png"></div></div>
<div class="card"><h3>90° CW (ROTATE_270)</h3><div class="box"><img src="777-top-cw.png"></div></div>
</div></body></html>
