<!DOCTYPE html><html><head><style>
body{background:#0a1929;color:#e2e8f0;font-family:system-ui;padding:2rem}
h1{color:#60a5fa;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.card{background:#0d1f35;border:1px solid #1e3a5f;border-radius:12px;padding:1rem}
.card h3{font-size:.8rem;color:#94a3b8;margin-bottom:.5rem}
.box{background:#060f1d;border-radius:8px;padding:.5rem;text-align:center}
.box img{max-width:100%;max-height:300px;filter:brightness(0) invert(1)}
</style></head><body>
<h1>777-300ER — Layer by Layer</h1>
<p style="color:#64748b;margin-bottom:1rem">Pick which layers are aircraft vs annotations</p>
<div class="grid"><div class="card"><h3>Layer 0</h3><div class="box"><img src="777-layer-0.png"></div></div>
<div class="card"><h3>Layer 1</h3><div class="box"><img src="777-layer-1.png"></div></div>
<div class="card"><h3>Layer 2</h3><div class="box"><img src="777-layer-2.png"></div></div>
<div class="card"><h3>Layer 3</h3><div class="box"><img src="777-layer-3.png"></div></div>
<div class="card"><h3>Layer 4</h3><div class="box"><img src="777-layer-4.png"></div></div>
<div class="card"><h3>Layer 12</h3><div class="box"><img src="777-layer-12.png"></div></div>
</div></body></html>
